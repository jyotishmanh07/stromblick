name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stromblick
          POSTGRES_PASSWORD: stromblick
          POSTGRES_DB: stromblick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromblick"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # The warehouse tests skip without a database locally; here they must run.
      REQUIRE_POSTGRES: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Coverage is enforced here and only here (fail_under in pyproject.toml), so the
      # data refresh's plain `pytest -q` can never be blocked by a coverage dip.
      - name: Test with coverage
        run: pytest -q --cov --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
