services:
  # Reporting warehouse for scripts/build_warehouse.py, scripts/generate_eda.py and
  # tests/test_warehouse.py. Every table is rebuilt from the snapshot, so no volume.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stromblick
      POSTGRES_PASSWORD: stromblick
      POSTGRES_DB: stromblick
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stromblick"]
      interval: 2s
      retries: 15
  api:
    build: .
    command: uvicorn energy_forecast.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  dashboard:
    build: .
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
