[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stromblick"
version = "0.1.0"
description = "24-hour German electricity demand forecasting and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pandas>=2.1,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "duckdb>=1.0,<2",
  "httpx>=0.27,<1",
  "holidays>=0.45,<1",
  "streamlit>=1.62,<2",
  "plotly>=5.20,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "matplotlib>=3.8,<4", "optuna>=3.6,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
# Streamlit Community Cloud installs dependencies with Poetry whenever a
# pyproject.toml is present. The distribution is "stromblick" but the import
# package is energy_forecast under src/ — point Poetry at it so `poetry install`
# builds the project instead of failing to find a "stromblick" folder.
packages = [{ include = "energy_forecast", from = "src" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
