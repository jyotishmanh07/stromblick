[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stromblick"
version = "0.1.0"
description = "24-hour German electricity demand forecasting and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pandas>=2.1,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "duckdb>=1.0,<2",
  "httpx>=0.27,<1",
  "holidays>=0.45,<1",
  "streamlit>=1.62,<2",
  "plotly>=5.20,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.5,<1", "matplotlib>=3.8,<4", "optuna>=3.6,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
# Streamlit Community Cloud installs dependencies with Poetry whenever a
# pyproject.toml is present. The distribution is "stromblick" but the import
# package is energy_forecast under src/ — point Poetry at it so `poetry install`
# builds the project instead of failing to find a "stromblick" folder.
packages = [{ include = "energy_forecast", from = "src" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# No --cov in addopts: coverage runs only where it is asked for (ci.yml), so fail_under
# can never block refresh-data.yml's plain `pytest -q` and stall the data refresh.

[tool.coverage.run]
# The importable package only. The Streamlit app and CLI scripts are integration surfaces
# and are deliberately outside the denominator, so the figure means "package coverage".
source = ["energy_forecast"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# A ratchet, not a target: the measured package figure rounded down. Raise it when coverage
# improves; never lower it to make a change pass.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The dashboard must extend sys.path before importing energy_forecast so a Streamlit
# Cloud deploy picks up new modules from the checkout instead of a stale installed copy.
"app/streamlit_app.py" = ["E402"]
